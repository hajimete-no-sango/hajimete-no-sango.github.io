<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a82c0">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サンゴ水槽">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>はじめてのサンゴ水槽 ～My First Reef～</title>
<style>
:root{--glass:rgba(255,255,255,.82);--ink:#24405c;--sub:#5d7890;--accent:#ff8a3d;--sea:#27a4d8;--ok:#3bbf7a;--warn:#f0a91e;--bad:#e8506a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#061a33;font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hidden{display:none!important}
.panel{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 6px 24px rgba(0,30,60,.22);border:1px solid rgba(255,255,255,.65);transition:background 1.4s,color 1.4s,border-color 1.4s}
body.night .panel{background:rgba(16,22,68,.74);color:#e8eeff;border-color:rgba(140,160,255,.28)}
body.night{--ink:#e8eeff;--sub:#aab6e8}
/* HUD */
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:4}
#hud .panel{pointer-events:auto}
#hudL{padding:8px 16px;display:flex;align-items:center;gap:14px;font-size:14px}
#hudL b{font-size:18px}
#hudL .cp b{color:#ff7a1a}
#hudR{padding:8px 12px;display:flex;align-items:center;gap:14px;font-size:12px}
.g{display:flex;flex-direction:column;gap:2px;min-width:70px}
.g label{color:var(--sub);font-size:11px}
.g b{font-size:15px}
.gbar{height:8px;width:90px;background:rgba(0,0,0,.1);border-radius:6px;overflow:hidden}
.gbar i{display:block;height:100%;width:80%;background:var(--ok);border-radius:6px;transition:width .5s,background .5s}
#sndBtn,#helpBtn{width:30px;height:30px;border-radius:50%;border:none;background:linear-gradient(#fff,#e2f2ff);font:inherit;font-weight:700;color:#24405c;cursor:pointer}
#mchip{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:7px 16px;font-size:13px;cursor:pointer;pointer-events:auto;z-index:4;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mchip b{color:#ff7a1a}
@media (max-width:900px){#mchip{top:62px;max-width:90vw}}
/* toolbar */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:7px 8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);z-index:4}
.grp{display:flex;gap:5px;align-items:center;padding:0 6px}
.grp+.grp{border-left:1px solid rgba(120,150,190,.25)}
button.tb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:5px 7px;border:none;border-radius:14px;background:linear-gradient(#fff,#e8f5ff);box-shadow:0 2px 0 rgba(0,60,120,.16);font:inherit;font-size:19px;color:#24405c;cursor:pointer;transition:transform .12s,background .6s,color .6s}
button.tb span{font-size:10.5px;font-weight:700;letter-spacing:.02em}
button.tb:hover{transform:translateY(-2px)}
button.tb:active{transform:translateY(1px)}
button.tb.on{background:linear-gradient(#ffe7cc,#ffc792);box-shadow:0 2px 0 rgba(200,100,20,.3)}
button.tb[disabled]{opacity:.45;cursor:default;transform:none}
body.night button.tb{background:linear-gradient(#2d3888,#1d2568);color:#e8eeff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
body.night button.tb.on{background:linear-gradient(#5a4dd8,#3a2fb0)}
#lightSlider{width:96px;accent-color:#5a6cff;cursor:pointer}
.lightwrap{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub);gap:2px}
/* mascot */
#mascot{position:fixed;left:12px;bottom:96px;display:flex;align-items:flex-end;gap:4px;pointer-events:none;z-index:5}
#mascot.quiz #nemo{animation:bob 1.2s ease-in-out infinite}
#mascot.quiz:after{content:'❓';position:absolute;left:62px;top:-6px;font-size:20px;animation:blink 1s infinite;pointer-events:none}
#nemo{;height:66px;pointer-events:auto;cursor:pointer;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
#bubble{pointer-events:auto;max-width:min(440px,68vw);padding:12px 16px 12px 14px;font-size:14px;line-height:1.7;margin-bottom:30px;position:relative;cursor:pointer}
#bubble:before{content:"";position:absolute;left:-9px;bottom:14px;border:9px solid transparent;border-right-color:rgba(255,255,255,.82);border-left:0}
body.night #bubble:before{border-right-color:rgba(16,22,68,.74)}
#bubble .nx{position:absolute;right:10px;bottom:4px;font-size:11px;color:var(--sub);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);padding:9px 18px;font-size:14px;font-weight:700;z-index:9;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-8px)}
/* place banner */
#place{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:10px 16px;font-size:14px;z-index:6;display:flex;gap:12px;align-items:center;max-width:94vw}
#place b{color:#ff7a1a}
#place .st{font-weight:700}
#place button{border:none;border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;background:#e8eef6;color:#24405c}
#place button.hot{background:linear-gradient(#6fd89a,#2fae6a);color:#fff;font-size:15px;padding:8px 14px}
#place button[disabled]{opacity:.4}
/* coral card */
#card{position:fixed;right:12px;top:66px;width:min(350px,94vw);max-height:calc(100vh - 170px);overflow:auto;padding:14px;z-index:6}
.ch{display:flex;gap:10px;align-items:center}
.ch img{width:120px;height:80px;border-radius:12px;flex:none}
.ch h3{font-size:17px;line-height:1.3}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#e2f3ff;color:#1d6fa5;margin-right:4px}
.chip.lps{background:#ffe9d6;color:#c2600f}.chip.sps{background:#f1e2ff;color:#7b3fc2}
body.night .chip{filter:brightness(.9)}
.rarechip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px;color:#6a3a00;background:linear-gradient(90deg,#ffe28a,#ffb3e6,#a8e8ff,#ffe28a);background-size:300% 100%;animation:rareflow 3s linear infinite}
@keyframes rareflow{to{background-position:300% 0}}
.stars{color:#ffb020;letter-spacing:1px;font-size:12px}
.mood{margin:10px 0 6px;font-size:14px;font-weight:700}
.row2{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}
.row2 .gbar{flex:1;width:auto}
.cond{list-style:none;margin:8px 0;font-size:12.5px}
.cond li{display:flex;gap:6px;padding:5px 0;border-bottom:1px dashed rgba(120,150,190,.3);line-height:1.5}
.cond .mk{width:18px;flex:none;text-align:center;font-weight:700}
.mk.o{color:var(--ok)}.mk.t{color:var(--warn)}.mk.x{color:var(--bad)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button,.pbtn{border:none;border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(#fff,#e6f2ff);color:#24405c;box-shadow:0 2px 0 rgba(0,60,120,.15)}
.btns button.hot,.pbtn.hot{background:linear-gradient(#ffb36b,#ff8a3d);color:#fff}
.btns button[disabled],.pbtn[disabled]{opacity:.45;cursor:default}
.xbtn{position:absolute;right:10px;top:8px;border:none;background:none;font-size:22px;color:var(--sub);cursor:pointer}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,12,30,.45);display:flex;align-items:center;justify-content:center;z-index:8}
#mcard{position:relative;width:min(900px,95vw);max-height:88vh;overflow:auto;padding:18px 20px}
#mcard h2{font-size:20px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;border-radius:12px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer;background:rgba(0,80,140,.08);color:inherit}
.tabs button.on{background:#ff8a3d;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.item{background:rgba(255,255,255,.55);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:12px;border:1px solid rgba(0,60,120,.08)}
body.night .item{background:rgba(40,50,120,.45)}
.item img{width:100%;border-radius:10px;aspect-ratio:16/10;object-fit:cover}
.item h4{font-size:14px}
.item .catch{color:var(--sub);font-size:11.5px}
.item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.price{font-weight:700;color:#ff7a1a;font-size:14px}
.item.locked img{filter:brightness(0) opacity(.35)}
.item.clickable{cursor:pointer;transition:transform .12s}
.item.clickable:hover{transform:translateY(-2px)}
.detail{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:16px}
@media (max-width:700px){.detail{grid-template-columns:1fr}}
.detail img{width:100%;border-radius:14px}
.detail dl{font-size:13px;line-height:1.7}
.detail dt{font-weight:700;color:#ff7a1a;margin-top:8px;font-size:12px}
.znav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 10px}.znav span{font-size:12px;color:var(--sub);white-space:nowrap}.znav button{border:none;border-radius:12px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;background:rgba(0,80,140,.1);color:inherit;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.znav button:hover{background:#5a6cff;color:#fff}
#zimg{touch-action:pan-y}
.morphs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.morphs button{border:none;border-radius:10px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;background:rgba(0,80,140,.1);color:inherit}
.morphs button.on{background:#5a6cff;color:#fff}
.morphs span{font-size:12px;padding:4px 8px;opacity:.5}
.mlist{list-style:none}
.mlist li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed rgba(120,150,190,.3);font-size:13px}
.mlist li .ic{font-size:18px;width:26px;text-align:center}
.mlist li.done{opacity:.55}
.mlist li.cur{background:rgba(255,160,80,.14);border-radius:10px}
.mlist small{color:var(--sub)}
.help p{font-size:13.5px;line-height:1.8;margin-bottom:8px}
/* title */
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,10,30,.35) 100%)}
.tcard{text-align:center;padding:34px 44px;border-radius:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);color:#fff;text-shadow:0 2px 12px rgba(0,30,80,.45)}
.tcard .l1{font-size:22px;letter-spacing:.2em}
.tcard .l2{font-size:52px;font-weight:800;letter-spacing:.08em;line-height:1.15}
.tcard .l3{font-size:14px;letter-spacing:.35em;opacity:.9;margin:6px 0 16px}
.tcard p{font-size:15px;line-height:1.9;margin-bottom:18px}
.tcard button{display:block;margin:8px auto;min-width:220px;border:none;border-radius:30px;padding:13px 26px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(#ffb36b,#ff7a2a);color:#fff;box-shadow:0 5px 0 #c9561a,0 10px 24px rgba(0,0,0,.25);transition:transform .12s}
.tcard button:hover{transform:translateY(-2px)}
.tcard button.ghost{background:rgba(255,255,255,.2);box-shadow:none;font-size:13px;min-width:0;padding:8px 18px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity .5s}
body.view #hudR,body.view .grp:nth-child(2),body.view #shopBtn,body.view #missionBtn,body.view #mascot{display:none!important}
body.titling #hud,body.titling #mchip,body.titling #bar,body.titling #mascot,body.shot #hud,body.shot #mchip,body.shot #bar,body.shot #mascot,body.shot #title,body.shot #toast{display:none!important}
@media (max-width:760px),(orientation:portrait){
 #hud{top:6px;left:6px;right:6px;flex-wrap:wrap;gap:4px}
 #hudL{padding:5px 10px;gap:8px;font-size:12px}#hudL b{font-size:15px}
 #hudR{padding:5px 8px;gap:7px;font-size:10px}.g{min-width:0}.g b{font-size:12px}.g label{font-size:9px}.gbar{width:46px}
 #sndBtn,#helpBtn{width:26px;height:26px}
 #mchip{top:auto;bottom:118px;font-size:11.5px;padding:5px 12px;max-width:92vw}
 #bar{bottom:6px;padding:4px;gap:2px;width:calc(100vw - 10px)}
 .grp{padding:0 2px;gap:2px;flex-wrap:wrap;justify-content:center}.grp+.grp{border-left:none}
 button.tb{min-width:42px;padding:3px 3px;font-size:16px;border-radius:11px}button.tb span{font-size:8.5px}
 #lightSlider{width:64px}.lightwrap{font-size:8.5px}
 #mascot{bottom:auto;top:92px;left:4px}#nemo{width:54px;height:42px}#bubble{max-width:calc(100vw - 72px);font-size:12.5px;margin-bottom:0;padding:9px 12px}
 #bubble:before{bottom:auto;top:12px}
 #card{left:6px;right:6px;width:auto;top:auto;bottom:6px;max-height:58vh}
 #mcard{width:100vw;max-height:94vh;padding:14px 12px;border-radius:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
 #place{top:auto;bottom:150px;flex-wrap:wrap;justify-content:center;font-size:13px;gap:8px}
 #toast{bottom:150px;white-space:normal;max-width:92vw;text-align:center}
 .tcard{padding:22px 20px}.tcard .l2{font-size:36px}.tcard .l1{font-size:17px}
}
</style>
</head>
<body class="titling">
<canvas id="c"></canvas>

<div id="hud">
  <div id="hudL" class="panel">
    <span>Day <b id="hDay">1</b></span><span id="hTime">9:00</span><span id="hSeason" title="季節">🌸</span><span id="hMoon" title="月の満ち欠け（満月の夜に何かが起きる…）">🌑</span><span class="cp">💎 <b id="hCp">40</b></span>
  </div>
  <div id="hudR" class="panel">
    <div class="g"><label>水のきれいさ</label><div class="gbar"><i id="gQ"></i></div></div>
    <div class="g"><label>塩分（比重）</label><b id="gS">1.024</b></div>
    <div class="g"><label>水温</label><b id="gT">25.5℃</b></div>
    <div class="g"><label>コケ</label><div class="gbar" style="width:60px"><i id="gA"></i></div></div>
    <button id="sndBtn" title="音のオン／オフ">🔊</button><button id="helpBtn" title="遊び方">？</button>
  </div>
</div>
<div id="mchip" class="panel">🎯 <span id="mTitle"></span></div>

<div id="bar" class="panel">
  <div class="grp">
    <button class="tb lb" data-light="0">☀️<span>白</span></button>
    <button class="tb lb" data-light="0.5">🌗<span>ミックス</span></button>
    <button class="tb lb" data-light="1">🌙<span>青</span></button>
    <div class="lightwrap"><input type="range" id="lightSlider" min="0" max="100" value="0"><span id="lightLbl">白色LED</span></div>

    <button class="tb" id="feedBtn">🍤<span>エサ</span></button>
    <button class="tb" id="topoffBtn">💧<span>足し水</span></button>
    <button class="tb" id="wcBtn">🔄<span>水換え</span></button>

  </div>
  <div class="grp">
    <button class="tb" id="shopBtn">🛒<span>ショップ</span></button>
    <button class="tb" id="zukanBtn">📖<span>図鑑</span></button>
    <button class="tb" id="missionBtn">🎯<span>ミッション</span></button>

  </div>
</div>

<div id="mascot">
  <svg id="nemo" viewBox="0 0 130 100" aria-label="クマノミ先生">
    <defs><clipPath id="nb"><ellipse cx="64" cy="54" rx="44" ry="30"/></clipPath></defs>

    <path d="M24 54 Q10 36 4 34 Q12 54 4 74 Q10 72 24 54 Z" fill="#ff7a1a" stroke="#2a2a2a" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="64" cy="54" rx="44" ry="30" fill="#ff7a1a"/>

      <path d="M78 20 Q88 54 78 88 L68 88 Q78 54 68 20 Z" fill="#fff"/>

    <circle cx="92" cy="46" r="10" fill="#fff" stroke="#2a2a2a" stroke-width="2.2"/>
    <circle cx="94" cy="47" r="6.5" fill="#1d1d2b"/><circle cx="96.5" cy="44" r="2.3" fill="#fff"/>

<div id="place" class="panel hidden"><span id="placeMsg"></span><span class="st" id="placeSt"></span><button id="placeOk" class="hot hidden">✅ ここに置く</button><button id="placeCancel">やめる</button></div>

    <div class="l3">MY FIRST REEF</div>
    <p>光と水と、小さな生きもの。<br>あなただけの海を育てよう。</p>
    <button id="startBtn">はじめる</button>
    <button id="resetBtn" class="ghost hidden">さいしょからやり直す</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   はじめてのサンゴ水槽 ― サンゴ未経験者向けの育成ゲーム（1ファイル完結）
   ・サンゴ/魚/機材/ミッションは下の「データ」節にまとめてある。
     種類を増やすときは CORALS にデータと R.<id>（描画）/ GEO.<id>（形）を足す。
   ・ゲーム内の数値はゲーム用に簡略化したもの（実際の飼育数値ではない）。
   ===================================================================== */
const W=1200,H=700,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sstep=t=>t*t*(3-2*t);
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

 const cw=innerWidth,ch=innerHeight;isPortrait=cw<ch*0.95;const fit=Math.min(cw/(2*CAM.hw+24),ch/H);
 SC=isPortrait?Math.max(fit,ch*0.74/H):fit;const vw=cw/SC,half=CAM.hw+12;
 CAM.x=vw>=2*half?CX:clamp(CAM.x,CX-half+vw/2,CX+half-vw/2);

/* ============================ 光（白⇔青をなめらかに） ============================
   L.m = 青の割合(0=白,1=青) / L.b = 明るさ。目標値(tm,tb)へ臨界減衰ばねで近づく
   → 動き始めと止まり際がゆっくりな「フェード」になる。サンゴの色も毎フレーム L から計算。 */
const L={m:0,b:1,tm:0,tb:1,vm:0,vb:0,cycle:false};
const BLUE_F=[0.13,0.22,0.82];
function lit(c,m=L.m,b=L.b){return[c[0]*(1+(BLUE_F[0]-1)*m)*b,c[1]*(1+(BLUE_F[1]-1)*m)*b,c[2]*(1+(BLUE_F[2]-1)*m)*b];}
function damp(cur,tgt,vk,st,dt){const om=2/st,x=om*dt,ex=1/(1+x+0.48*x*x+0.235*x*x*x);const ch=cur-tgt;const tp=(L[vk]+om*ch)*dt;L[vk]=(L[vk]-om*tp)*ex;let o=tgt+(ch+tp)*ex;if((tgt-cur>0)===(o>tgt)){o=tgt;L[vk]=0;}return o;}
function schedule(h){ // 1日の照明スケジュール（本物のサンゴ水槽の点灯パターンを簡略化）
 const r=(a,b)=>sstep(clamp((h-a)/(b-a),0,1));
 let b=0.2+0.8*r(6,7.5)-0.8*r(21,22.5); let m=1-r(7.5,10)+r(16,18.5);
 return{m:clamp(m,0,1),b:clamp(b,0.2,1)};}
function setLight(v){L.cycle=false;L.tm=v;L.tb=1;syncLightUI();}

/* ============================ 環境（岩・砂）の事前描画 ============================ */
const sandTop=x=>612+6*Math.sin(x*0.012)+4*Math.sin(x*0.031+1);
const ROCK_DEF=[
 {x0:820,x1:1185,top:440,seed:31,peaks:[[0.3,1,0.28],[0.74,0.78,0.22]]},
 {x0:15,x1:525,top:345,seed:11,peaks:[[0.28,1,0.27],[0.7,0.7,0.24]]},
 {x0:515,x1:845,top:268,seed:21,peaks:[[0.44,1,0.3],[0.64,0.88,0.24]]},
 {x0:380,x1:625,top:522,seed:41,peaks:[[0.5,1,0.36]]},
 {x0:-210,x1:75,top:470,seed:51,peaks:[[0.55,1,0.3]]},
 {x0:1165,x1:1420,top:415,seed:61,peaks:[[0.4,1,0.28],[0.8,0.6,0.2]]},
];
const ROCKS=ROCK_DEF.map(d=>{const r=rng(d.seed);const pts=[];const N=46,base=662;
 for(let i=0;i<=N;i++){const u=i/N;let p=0;for(const[c,h,w]of d.peaks)p=Math.max(p,h*Math.exp(-(((u-c)/w)**2)));p*=Math.pow(Math.sin(Math.PI*u),0.5);
  pts.push([lerp(d.x0,d.x1,u)+(r()-0.5)*5,base-(base-d.top)*p+(r()-0.5)*7+(Math.sin(u*13+d.seed)*7+Math.sin(u*31+d.seed*2)*4)*Math.min(1,p*3)]);}
 const path=new Path2D();path.moveTo(d.x0,base+40);path.lineTo(pts[0][0],pts[0][1]);
 for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;path.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
 path.lineTo(d.x1,base+40);path.closePath();return Object.assign({},d,{pts,path});});
function surfaceY(x){let y=sandTop(x);for(const rk of ROCKS){if(x<rk.x0||x>rk.x1)continue;const u=(x-rk.x0)/(rk.x1-rk.x0)*(rk.pts.length-1);const i=Math.floor(u),f=u-i;const a=rk.pts[i],b=rk.pts[Math.min(i+1,rk.pts.length-1)];y=Math.min(y,lerp(a[1],b[1],f));}return y;}
function onRock(x,y){MC.save();MC.setTransform(1,0,0,1,0,0);let hit=false;for(const rk of ROCKS)if(MC.isPointInPath(rk.path,x,y)){hit=true;break;}MC.restore();return hit;}

  for(let i=0;i<Math.floor(bw*0.22);i++){const x=rk.x0+r()*bw,y=rk.top+10+r()*bh;const s=2+r()*5;g.fillStyle=T('#fff0e0',0.25);g.beginPath();g.ellipse(x,y-1,s*1.1,s*0.7,0,0,TAU);g.fill();g.fillStyle=T('#3d2e2c',0.7);g.beginPath();g.ellipse(x,y,s,s*0.6,0,0,TAU);g.fill();}
  for(let i=0;i<bw*1.4;i++){g.fillStyle=r()<0.5?T('#ffffff',0.25):T('#40302c',0.3);g.fillRect(rk.x0+r()*bw,rk.top+r()*bh,1.2,1.2);}
  const sh=g.createLinearGradient(0,540,0,662);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,m?'rgba(0,0,20,0.5)':'rgba(40,30,40,0.35)');g.fillStyle=sh;g.fillRect(rk.x0-10,500,bw+20,200);
  g.restore();

 // 砂

 const sg=g.createLinearGradient(0,600,0,700);sg.addColorStop(0,T('#f7ecd4'));sg.addColorStop(1,T('#d8c29a'));g.fillStyle=sg;g.fill();

 const r=rng(99);const gc=['#ffffff','#e9d8b4','#c9b48c','#f3c9c9','#bdb3a6'];
 for(let i=0;i<2600;i++){const x=ENV.x0+r()*ENV.w,y=sandTop(x)+2+r()*80;g.fillStyle=T(gc[(r()*gc.length)|0],0.55);g.beginPath();g.arc(x,y,0.5+r()*1.2,0,TAU);g.fill();}

/* コースティクス（水面のゆらめきが底に映る光）：継ぎ目のないボロノイ模様を生成 */
function makeCaustic(col){const S=320,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');const r=rng(7);const N=20,pts=[];for(let i=0;i<N;i++)pts.push([r()*S,r()*S]);
 const img=g.createImageData(S,S);const d=img.data;
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){let d1=1e9,d2=1e9;for(const p of pts){let dx=Math.abs(x-p[0]);dx=Math.min(dx,S-dx);let dy=Math.abs(y-p[1]);dy=Math.min(dy,S-dy);const dd=dx*dx+dy*dy;if(dd<d1){d2=d1;d1=dd;}else if(dd<d2)d2=dd;}
  const e=Math.sqrt(d2)-Math.sqrt(d1);const v=Math.pow(Math.exp(-e*0.26),2);const i=(y*S+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=v*190;}
 g.putImageData(img,0,0);const c2=document.createElement('canvas');c2.width=c2.height=S;const g2=c2.getContext('2d');g2.filter='blur(1.6px)';g2.drawImage(c,0,0);return c2;}
let CAU_D,CAU_N,PAT_D,PAT_N;
function initCaustics(){CAU_D=makeCaustic([255,252,235]);CAU_N=makeCaustic([110,130,255]);PAT_D=MC.createPattern(CAU_D,'repeat');PAT_N=MC.createPattern(CAU_N,'repeat');}

/* 発光スプライト（青い光の時の蛍光のにじみ） */
const GS=new Map();
function gsprite(c){const k=(c[0]|0)+','+(c[1]|0)+','+(c[2]|0);let s=GS.get(k);if(!s){s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${k},0.9)`);gr.addColorStop(0.3,`rgba(${k},0.45)`);gr.addColorStop(0.65,`rgba(${k},0.12)`);gr.addColorStop(1,`rgba(${k},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);GS.set(k,s);}return s;}
function glow(x,y,rx,ry,c,a){if(!c||a<0.01)return;ctx.globalAlpha=Math.min(1,a*1.35);ctx.drawImage(gsprite(c),x-rx,y-ry,rx*2,ry*2);}
function ep(x,y,rx,ry,rot=0){rx=Math.max(0.05,rx);ry=Math.max(0.05,ry);ctx.moveTo(x+rx*Math.cos(rot),y+rx*Math.sin(rot));ctx.ellipse(x,y,rx,ry,rot,0,TAU);}

/* ============================ サンゴの描画 ============================ */
const PALE=[236,228,214],PALE_F=[150,158,205];
const bleachOf=c=>c.dead?0:clamp((0.5-c.h)/0.4,0,1);
const SKEL=[214,208,196],ALGAE=[140,134,96],MELT=[128,104,78];
const isSoft=c=>CORALS[c.sp].group==='ソフトコーラル';
function deadCol(c){if(isSoft(c))return MELT;return mixc(SKEL,ALGAE,Math.min(1,(S.day-(c.deadDay||S.day))/3)*0.65);}
function palOf(c){const mo=CORALS[c.sp].morphs[c.morph];if(c.dead){const dc=deadCol(c);const P={_fa:0,_day:(1-L.m)*L.b*0.5,_a:{}};for(const key in mo.pal){const col=lit(mixc(dc,hx(mo.pal[key][0]),0.12));P[key]=rgba(col);P._a[key]=col;}return P;}const bl=bleachOf(c);const k=L.m*L.b;const P={_fa:k*(1-bl),_day:(1-L.m)*L.b,_a:{}};
 const rh=mo.rare&&!bl?Math.round(95*Math.sin(NOW*0.9+(c.seed%97))/10)*10:0; // レア：色が虹のように移ろう
 for(const key in mo.pal){const e=mo.pal[key];let d=hx(e[0]);if(bl)d=mixc(d,PALE,bl);let col=lit(d);if(e[1]){let f=hx(e[1]);if(bl)f=mixc(f,PALE_F,bl);col=mixc(col,f,k);P[key+'_g']=rh?hueShift(hx(e[1]),rh,1.3):hx(e[1]);if(rh)col=hueShift(col,rh,1.3);}P[key]=rgba(col);P._a[key]=col;}
 return P;}
let NOW=0,NIGHTF=0;
function hueShift(c,deg,sat=1){let r=c[0]/255,g=c[1]/255,b=c[2]/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sl=0;const l=(mx+mn)/2;
 if(mx!==mn){const d=mx-mn;sl=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}
 h=(h+deg/360+1)%1;sl=Math.min(1,sl*sat);const q=l<0.5?l*(1+sl):l+sl-l*sl,p2=2*l-q;const f=t=>{t=(t+1)%1;return t<1/6?p2+(q-p2)*6*t:t<1/2?q:t<2/3?p2+(q-p2)*(2/3-t)*6:p2;};
 return sl===0?[l*255,l*255,l*255]:[f(h+1/3)*255,f(h)*255,f(h-1/3)*255];}
const coralScale=c=>1.32*CORALS[c.sp].size*(0.55+0.45*Math.min(c.g,1.25));
let SW=1; // 水流による揺れの大きさ
const GEO={},R={};
function geo(c){if(!c._geo)c._geo=GEO[c.sp](rng(c.seed));return c._geo;}
function gloss(x,y,rx,ry,P,a=0.3){if(P._day<0.05)return;ctx.fillStyle=`rgba(255,255,255,${a*P._day})`;ctx.beginPath();ep(x,y,rx,ry);ctx.fill();}
function additive(fn){ctx.globalCompositeOperation='lighter';fn();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}

GEO.zoa=r=>{const ps=[];for(let i=0;i<26;i++){const a=r()*TAU,rad=i<3?r()*8:8+Math.sqrt(r())*34;ps.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad*0.42,h:7+r()*9,sz:6.5+r()*2.5,ph:r()*TAU,d:rad});}ps.sort((a,b)=>a.d-b.d);return{ps};};
R.zoa=(c,P,t,G)=>{const n=Math.min(G.ps.length,Math.round(5+c.g*17));const open=1-c.ret*0.8;const list=G.ps.slice(0,n).sort((a,b)=>a.y-b.y);
 ctx.fillStyle=P.col;ctx.beginPath();ep(0,2,14+Math.min(n,22)*1.4,6+n*0.25);ctx.fill();
 const tops=[];ctx.lineCap='round';
 for(const p of list){const sw=Math.sin(t*1.3+p.ph)*SW*1.6;const hh=p.h*(0.45+0.55*open);const tx=p.x+sw,ty=p.y-hh;
  ctx.strokeStyle=P.col;ctx.lineWidth=p.sz*0.95;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+sw*0.2,p.y-hh*0.5,tx,ty);ctx.stroke();
  const rx=p.sz*(0.5+0.7*open),ry=rx*0.52;
  if(open>0.25){ctx.fillStyle=P.skirt;ctx.beginPath();for(let k=0;k<12;k++){const a=k/12*TAU+p.ph;ep(tx+Math.cos(a)*rx*0.95,ty+Math.sin(a)*ry*0.95,rx*0.3,ry*0.4,a);}ctx.fill();}
  ctx.fillStyle=P.disc;ctx.beginPath();ep(tx,ty,rx*0.8,ry*0.8);ctx.fill();
  ctx.fillStyle=P.mouth;ctx.beginPath();ep(tx,ty,rx*0.26,ry*0.26);ctx.fill();
  gloss(tx-rx*0.3,ty-ry*0.38,rx*0.24,ry*0.15,P,0.45);tops.push(tx,ty,rx);}

GEO.gsp=r=>{const mat=[];const N=16;for(let i=0;i<N;i++){const a=i/N*TAU,rr=44*(0.78+0.22*r());mat.push([Math.cos(a)*rr,Math.sin(a)*rr*0.36-2]);}
 const ps=[];for(let i=0;i<90;i++){const a=r()*TAU,rad=Math.sqrt(r());ps.push({x:Math.cos(a)*rad*38,y:Math.sin(a)*rad*13-3,len:6+r()*8,ph:r()*TAU,d:rad});}ps.sort((a,b)=>a.d-b.d);return{mat,ps};};
R.gsp=(c,P,t,G)=>{const n=Math.min(G.ps.length,Math.round(25+c.g*60));const open=1-c.ret*0.85;const ms=0.6+0.4*Math.min(1.2,c.g);const m=G.mat;

 if(open>0.2){const tl=3.6*open;ctx.strokeStyle=P.tent;ctx.lineWidth=1.35;ctx.beginPath();for(let i=0;i<tips.length;i+=2){for(let k=0;k<8;k++){const a=k/8*TAU+i;ctx.moveTo(tips[i],tips[i+1]);ctx.lineTo(tips[i]+Math.cos(a)*tl,tips[i+1]+Math.sin(a)*tl*0.62);}}ctx.stroke();}
 ctx.fillStyle=P.center;ctx.beginPath();for(let i=0;i<tips.length;i+=2)ep(tips[i],tips[i+1],0.5+1.0*open,0.4+0.8*open);ctx.fill();
 if(P._fa>0.02)additive(()=>{glow(0,-8,52*ms,22*ms,P.tent_g,P._fa*0.55);for(let i=0;i<tips.length;i+=8)glow(tips[i],tips[i+1],8,6,P.tent_g,P._fa*0.5);});};

GEO.mushroom=r=>({d:[[0,-2],[-22,2],[21,0],[-9,-13],[12,-15]].map(([x,y],i)=>({x:x+(r()-0.5)*4,y,r:16+r()*6-(i>2?3:0),ph:r()*TAU,rot:(r()-0.5)*0.4,spots:Array.from({length:10},()=>[r()*TAU,0.25+r()*0.6])}))});

function tailPath(h,wag){ctx.beginPath();ctx.moveTo(-11,0);ctx.quadraticCurveTo(-17,-h*0.25+wag*0.5,-24,-h*0.85+wag);ctx.quadraticCurveTo(-20,wag,-24,h*0.85+wag);ctx.quadraticCurveTo(-17,h*0.25+wag*0.5,-11,0);ctx.closePath();}
const lc=h=>rgba(lit(hx(h)));
function eye(x,y,r,blink,happy){const k=lc('#141428');if(blink>0||happy>0.6){ctx.strokeStyle=k;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y+r*0.35,r*0.75,Math.PI*1.15,Math.PI*1.85);ctx.stroke();return;}
 ctx.fillStyle=lc('#ffffff');ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.fillStyle=k;ctx.beginPath();ctx.arc(x+r*0.22,y+r*0.08,r*0.68,0,TAU);ctx.fill();
 ctx.fillStyle=`rgba(255,255,255,${0.55+0.45*L.b})`;ctx.beginPath();ctx.arc(x+r*0.45,y-r*0.3,r*0.3,0,TAU);ctx.fill();}
function shade(h,nose){ctx.save();fishBody(h,nose);ctx.clip();const g=ctx.createLinearGradient(0,-h,0,h);g.addColorStop(0,`rgba(255,255,255,${0.3*(1-L.m)*L.b})`);g.addColorStop(0.5,'rgba(255,255,255,0)');g.addColorStop(1,`rgba(0,0,30,${0.18*L.b})`);ctx.fillStyle=g;ctx.fillRect(-20,-h*1.3,40,h*2.6);ctx.restore();}
const FDRAW={
 clown(f,t,wag){const h=10,O=lc('#ff7a1a'),K=lc('#1d1d1d'),Wt=lc('#ffffff');ctx.lineJoin='round';
  ctx.fillStyle=O;ctx.strokeStyle=K;ctx.lineWidth=1.2;tailPath(h,wag);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-h*0.9);ctx.quadraticCurveTo(0,-h*1.75,-9,-h*0.5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(3,h*0.9);ctx.quadraticCurveTo(-3,h*1.5,-8,h*0.5);ctx.closePath();ctx.fill();ctx.stroke();
  fishBody(h);ctx.fill();ctx.save();ctx.clip();for(const[bx,bw]of[[8,4.4],[-2,5.4],[-11.5,3.2]]){ctx.fillStyle=K;ctx.beginPath();ctx.ellipse(bx,0,bw/2+1.1,h*1.3,0,0,TAU);ctx.fill();ctx.fillStyle=Wt;ctx.beginPath();ctx.ellipse(bx,0,bw/2,h*1.3,0,0,TAU);ctx.fill();}ctx.restore();
  shade(h);ctx.strokeStyle=K;ctx.lineWidth=1;fishBody(h);ctx.stroke();return[10,-2.5,3.8,h];},
 firefish(f,t,wag){const h=6.5;const sp=Math.sin(t*6+f.ph)*2;
  ctx.fillStyle=lc('#7b34c8');tailPath(h,wag);ctx.fill();
  ctx.fillStyle=lc('#ff4a3a');ctx.beginPath();ctx.moveTo(7,-h*0.8);ctx.quadraticCurveTo(2,-22+sp,-1,-h*0.8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-1,-h*0.7);ctx.quadraticCurveTo(-7,-h*1.6,-12,-h*0.4);ctx.lineTo(-1,-h*0.4);ctx.fill();
  fishBody(h,18);const g=ctx.createLinearGradient(18,0,-13,0);g.addColorStop(0,lc('#fff3dc'));g.addColorStop(0.45,lc('#ffe4c8'));g.addColorStop(0.78,lc('#ff6a4a'));g.addColorStop(1,lc('#ff3a4a'));ctx.fillStyle=g;ctx.fill();
  shade(h,18);return[11,-1.4,3.1,h];},
 yellowtang(f,t,wag){const h=15,Y=lc('#ffd92e'),Y2=lc('#ffc21a');
  ctx.fillStyle=Y2;tailPath(h*0.7,wag);ctx.fill();
  ctx.beginPath();ctx.moveTo(12,-h*0.8);ctx.quadraticCurveTo(-2,-h*1.55,-12,-h*0.4);ctx.lineTo(-4,-h*0.7);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(8,h*0.85);ctx.quadraticCurveTo(-4,h*1.5,-12,h*0.4);ctx.lineTo(-4,h*0.7);ctx.closePath();ctx.fill();
  ctx.fillStyle=Y;fishBody(h,17);ctx.fill();ctx.beginPath();ctx.moveTo(14,-5);ctx.quadraticCurveTo(20,-3,21,-1.2);ctx.quadraticCurveTo(18,1,14,2);ctx.fill();
  ctx.fillStyle=lc('#ffffff');ctx.beginPath();ctx.ellipse(-9.5,0.5,1.8,1.1,0,0,TAU);ctx.fill();shade(h,17);return[9,-5,4.1,h];},
 bluetang(f,t,wag){const h=12,B=lc('#2a5fe0'),K=lc('#0d1440'),Yl=lc('#ffd21f');
  ctx.fillStyle=Yl;tailPath(h*0.8,wag);ctx.fill();ctx.strokeStyle=K;ctx.lineWidth=1.3;ctx.stroke();
  ctx.fillStyle=B;ctx.beginPath();ctx.moveTo(11,-h*0.85);ctx.quadraticCurveTo(-2,-h*1.4,-12,-h*0.4);ctx.lineTo(-2,-h*0.6);ctx.closePath();ctx.fill();ctx.strokeStyle=K;ctx.stroke();
  fishBody(h);ctx.fill();ctx.save();ctx.clip();ctx.strokeStyle=K;ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(11,-6);ctx.quadraticCurveTo(0,-10,-12,-4);ctx.stroke();ctx.lineWidth=2.6;ctx.beginPath();ctx.ellipse(-2,-2,7,3.2,-0.1,0,TAU);ctx.stroke();ctx.restore();
  ctx.fillStyle=Yl;ctx.beginPath();ctx.ellipse(3,4,4,1.8,0.5,0,TAU);ctx.fill();shade(h);return[10,-3,3.8,h];},
 chromis(f,t,wag){const h=8,B2=lc('#2fa8b8');ctx.fillStyle=B2;ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-23,-7+wag);ctx.lineTo(-18,wag*0.5);ctx.lineTo(-23,7+wag);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(8,-h*0.9);ctx.quadraticCurveTo(-2,-h*1.6,-10,-h*0.4);ctx.closePath();ctx.fill();
  fishBody(h,15);const g=ctx.createLinearGradient(0,-h,0,h);g.addColorStop(0,lc('#a0f4e6'));g.addColorStop(1,lc('#4cc8c0'));ctx.fillStyle=g;ctx.fill();shade(h,15);return[9,-2,3.3,h];},
 gramma(f,t,wag){const h=8.5,Pp=lc('#a646d8'),Y=lc('#ffd21f');ctx.fillStyle=Y;tailPath(h*0.8,wag);ctx.fill();
  ctx.fillStyle=Pp;ctx.beginPath();ctx.moveTo(10,-h*0.85);ctx.quadraticCurveTo(0,-h*1.55,-11,-h*0.45);ctx.lineTo(-2,-h*0.6);ctx.closePath();ctx.fill();
  fishBody(h,16);const g=ctx.createLinearGradient(16,0,-13,0);g.addColorStop(0,Pp);g.addColorStop(0.45,Pp);g.addColorStop(0.62,Y);g.addColorStop(1,Y);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle=lc('#1a1a2a');ctx.beginPath();ctx.arc(4,-h*1.02,1.5,0,TAU);ctx.fill();shade(h,16);return[10,-2,3.4,h];},
 blenny(f,t,wag){const h=6,Ol=lc('#a3a06c'),D=lc('#5e5a3a');ctx.fillStyle=D;tailPath(h,wag*0.5);ctx.fill();
  ctx.fillStyle=Ol;ctx.beginPath();ctx.moveTo(10,-h*0.9);ctx.quadraticCurveTo(-4,-h*1.7,-11,-h*0.5);ctx.lineTo(10,-h*0.5);ctx.fill();
  fishBody(h,17);ctx.fillStyle=Ol;ctx.fill();ctx.save();ctx.clip();ctx.fillStyle=D;for(let k=0;k<9;k++){ctx.beginPath();ctx.arc(-10+k*3,-1+(k%2)*3,1.2,0,TAU);ctx.fill();}ctx.restore();
  ctx.strokeStyle=D;ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(12,-5.5);ctx.lineTo(12.5,-9.5);ctx.moveTo(13.5,-5.5);ctx.lineTo(15,-9);ctx.stroke();
  ctx.fillStyle=lc('#d8c8a0');ctx.beginPath();ctx.ellipse(16.6,1.2,2,2.5,0,0,TAU);ctx.fill();shade(h,17);return[12,-3.4,3.4,h];},
 mandarin(f,t,wag){const h=9,O=lc('#ff7a2a'),Bl=lc('#2a6ae0'),Gc=lc('#3ad0a0');
  ctx.fillStyle=Bl;tailPath(h*0.8,wag);ctx.fill();
  ctx.fillStyle=O;ctx.beginPath();ctx.moveTo(6,-h*0.8);ctx.quadraticCurveTo(-2,-h*2.1,-9,-h*0.5);ctx.closePath();ctx.fill();
  fishBody(h,14);ctx.fillStyle=O;ctx.fill();ctx.save();ctx.clip();
  for(const[col,wd,off]of[[Bl,2.3,0],[Gc,0.9,1.7]]){ctx.strokeStyle=col;ctx.lineWidth=wd;for(let k=-2;k<=2;k++){ctx.beginPath();for(let x=-14;x<=16;x+=3){const y=k*4+Math.sin(x*0.5+k)*1.8+off;x===-14?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}}ctx.restore();
  ctx.fillStyle=rgba(lit(hx('#ffb05a')),0.85);ctx.beginPath();ctx.ellipse(2,3,6,3.6,0.6+Math.sin(t*9+f.ph)*0.4,0,TAU);ctx.fill();
  shade(h,14);return[9,-3,3.7,h];},
};
const fishScale=f=>FSZ*FISH[f.sp].size*(0.55+0.5*(f.dg!=null?f.dg:(f.ref&&f.ref.g!=null?f.ref.g:0.9)));
function drawFish(f,t){const sp=FISH[f.sp];const s=fishScale(f)*(1+f.happy*0.05);ctx.save();ctx.translate(f.x,f.y+Math.sin(t*2+f.ph)*1.5);ctx.rotate(clamp(f.vy/160,-0.35,0.35));ctx.scale((Math.abs(f.face)<0.12?0.12*Math.sign(f.face||1):f.face)*s,s);
 const spd=Math.hypot(f.vx,f.vy);const wag=Math.sin(t*(7+spd*0.12)+f.ph)*(1.2+spd*0.03);
 const[ex,ey,er,h]=FDRAW[f.sp](f,t,wag);
 ctx.fillStyle=lc('#ffffff');ctx.globalAlpha=0.35;ctx.beginPath();ctx.ellipse(2,h*0.35,4,2,0.4+Math.sin(t*9+f.ph)*0.3,0,TAU);ctx.fill();ctx.globalAlpha=1;
 eye(ex,ey,er,f.blink,f.happy);
 ctx.fillStyle=rgba(lit(hx('#ff8fab')),0.55);ctx.beginPath();ctx.ellipse(ex-2,ey+er+2,2.6,1.4,0,0,TAU);ctx.fill();
 if(f.ref&&f.ref.ich)drawIch();
 ctx.restore();}

/* ============================ 背景・水・光 ============================ */
const BG_D=['#b6f1ff','#59c7ee','#1a82c0'],BG_N=['#2c38c4','#141b84','#03051f'];
function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);const bb=0.22+0.78*L.b;[0,0.38,1].forEach((s,i)=>g.addColorStop(s,rgba(mixc(hx(BG_D[i]),hx(BG_N[i]),L.m).map(v=>v*bb))));ctx.fillStyle=g;ctx.fillRect(-2000,-200,W+4000,H+800);}
function drawRays(t){const a=((1-L.m)*0.17+L.m*0.08)*L.b;if(a<0.01)return;const col=mixc([255,253,235],[110,120,255],L.m);ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=-2;i<10;i++){const x=40+i*160+Math.sin(t*0.12+i*1.7)*60;const w=50+30*Math.sin(i*2.3+t*0.2);const al=a*(0.6+0.4*Math.sin(t*0.5+i*1.3));
  const g=ctx.createLinearGradient(0,0,0,H*0.92);g.addColorStop(0,rgba(col,al));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w*0.5,0);ctx.lineTo(x+w*0.5,0);ctx.lineTo(x+w*1.5+110,H*0.92);ctx.lineTo(x-w*0.3+110,H*0.92);ctx.closePath();ctx.fill();}ctx.restore();}
function drawEnv(){ctx.drawImage(ENV.day,ENV.x0,ENV.y0,ENV.w,ENV.h);if(L.m>0.003){ctx.globalAlpha=L.m;ctx.drawImage(ENV.night,ENV.x0,ENV.y0,ENV.w,ENV.h);ctx.globalAlpha=1;}
 if(L.b<0.999){ctx.fillStyle=`rgba(0,2,12,${(1-L.b)*0.8})`;ctx.fillRect(-2000,-200,W+4000,H+800);}}
function drawCaustics(t,surface){const aD=(1-L.m)*L.b*(surface?0.3:0.035),aN=L.m*L.b*(surface?0.16:0.03);ctx.save();if(surface)ctx.clip(SURF);ctx.globalCompositeOperation='lighter';
 const lay=(pat,a,ox,oy,sc)=>{if(a<0.01)return;pat.setTransform(new DOMMatrix([sc,0,0,sc*0.62,ox,oy]));ctx.globalAlpha=a;ctx.fillStyle=pat;ctx.fillRect(-500,surface?150:60,W+1000,H);};
 lay(PAT_D,aD,t*14,t*5,1.9);lay(PAT_D,aD*0.7,-t*10,t*8+90,1.4);lay(PAT_N,aN,t*14,t*5,1.9);lay(PAT_N,aN*0.7,-t*10,t*8+90,1.4);ctx.restore();}
function drawEquip(t){if(S.eq.pump>=1)pumpAt(CX-CAM.hw+50,170,t);if(S.eq.pump>=2)pumpAt(CX+CAM.hw-50,150,t);}
function pumpAt(x,y,t){ctx.save();ctx.translate(x,y);ctx.scale(0.75,0.75);ctx.globalAlpha=0.8;ctx.fillStyle=lc('#2a3038');ctx.beginPath();ctx.roundRect(-16,-16,32,32,9);ctx.fill();ctx.strokeStyle=lc('#566070');ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,10,0,TAU);ctx.stroke();ctx.rotate(t*6);ctx.strokeStyle=lc('#8c96a4');ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<3;k++){const a=k/3*TAU;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*8,Math.sin(a)*8);}ctx.stroke();ctx.restore();}
function drawTop(t){ctx.strokeStyle=`rgba(255,255,255,${(0.35-L.m*0.15)*L.b})`;ctx.lineWidth=2;ctx.beginPath();for(let x=-400;x<=W+400;x+=16){const y=24+Math.sin(x*0.03+t*1.5)*2+Math.sin(x*0.013-t)*1.5;x===-400?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
 const g0=ctx.createLinearGradient(0,0,0,26);g0.addColorStop(0,`rgba(255,255,255,${0.18*L.b})`);g0.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g0;ctx.fillRect(-2000,0,W+4000,26);
 ctx.fillStyle='#141a24';ctx.fillRect(-2000,-200,W+4000,210);
 const em=mixc([255,250,236],[80,100,255],L.m);const n=Math.max(4,Math.round([10,14,18][S.eq.led]*CAM.hw/600));
 const g=ctx.createLinearGradient(0,10,0,90);g.addColorStop(0,rgba(em,0.3*L.b));g.addColorStop(1,rgba(em,0));ctx.fillStyle=g;ctx.fillRect(-2000,10,W+4000,80);
 for(let i=0;i<n;i++){const x=CX-CAM.hw+2*CAM.hw*(i+0.5)/n;ctx.fillStyle=rgba(mixc([50,52,60],em,0.25+0.75*L.b));ctx.beginPath();ctx.roundRect(x-12,3,24,6,3);ctx.fill();}}
function drawRoom(){const l=CX-CAM.hw,r=CX+CAM.hw;const g=ctx.createLinearGradient(0,-60,0,H+60);g.addColorStop(0,'#0d1728');g.addColorStop(1,'#04080f');ctx.fillStyle=g;ctx.fillRect(l-4000,-600,4000,H+1200);ctx.fillRect(r,-600,4000,H+1200);ctx.fillRect(l-10,-1600,r-l+20,1545);
 const st=ctx.createLinearGradient(0,H,0,H+160);st.addColorStop(0,'#2a2f3a');st.addColorStop(0.08,'#1c212b');st.addColorStop(1,'#10131a');ctx.fillStyle=st;ctx.fillRect(l-24,H-6,r-l+48,1400);
 ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(l-24,H-6,r-l+48,2);ctx.fillStyle='#0b0e14';ctx.fillRect(CX-1,H+20,2,1400);
 ctx.fillStyle='#161c26';ctx.fillRect(l-9,-40,9,H+100);ctx.fillRect(r,-40,9,H+100);
 const a=0.16*L.b;const gl=ctx.createLinearGradient(l,0,l+46,0);gl.addColorStop(0,`rgba(255,255,255,${a})`);gl.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gl;ctx.fillRect(l,0,46,H);
 const gr=ctx.createLinearGradient(r-46,0,r,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(255,255,255,${a*0.7})`);ctx.fillStyle=gr;ctx.fillRect(r-46,0,46,H);}
function drawVignette(){const g=ctx.createRadialGradient(CX,H*0.45,H*0.35,CX,H*0.5,Math.max(700,CAM.hw*1.25));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,8,30,${0.28+0.22*L.m})`);ctx.fillStyle=g;ctx.fillRect(-2000,-200,W+4000,H+800);}

/* ============================ パーティクル ============================ */
const PARTS=[],FOOD=[],SNOW=[];
for(let i=0;i<90;i++)SNOW.push({x:-200+Math.random()*1600,y:Math.random()*H,r:0.6+Math.random()*1.4,v:3+Math.random()*6,ph:Math.random()*TAU});
function addPart(p){PARTS.push(p);if(PARTS.length>400)PARTS.shift();}
function heartPath(x,y,s){ctx.moveTo(x,y+s*0.3);ctx.bezierCurveTo(x,y,x-s*0.5,y-s*0.3,x-s*0.5,y+s*0.05);ctx.bezierCurveTo(x-s*0.5,y+s*0.4,x,y+s*0.6,x,y+s*0.9);ctx.bezierCurveTo(x,y+s*0.6,x+s*0.5,y+s*0.4,x+s*0.5,y+s*0.05);ctx.bezierCurveTo(x+s*0.5,y-s*0.3,x,y,x,y+s*0.3);}
function star(x,y,s){ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);}
function sparkle(x,y,n=8,col=[255,240,160]){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=20+Math.random()*50;addPart({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,life:0.8,max:0.8,s:3+Math.random()*4,col});}}
function bubbles(x,y,n){for(let i=0;i<n;i++)addPart({type:'bubble',x:x+(Math.random()-0.5)*60,y:y+Math.random()*30,vx:0,vy:-(40+Math.random()*60),life:3,max:3,s:2+Math.random()*4,ph:Math.random()*TAU});}
function updParts(dt,t){for(const p of PARTS){p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.type==='egg'){p.x+=Math.sin(t*1.8+p.ph)*0.35;if(p.y<30)p.life=Math.min(p.life,1);}if(p.type==='bubble'){p.x+=Math.sin(t*4+p.ph)*0.4;if(p.y<30)p.life=0;}if(p.type==='spark'){p.vx*=0.95;p.vy*=0.95;}}
 for(let i=PARTS.length-1;i>=0;i--)if(PARTS[i].life<=0)PARTS.splice(i,1);
 for(const s of SNOW){s.y+=s.v*dt*0.4;s.x+=Math.sin(t*0.4+s.ph)*0.15;if(s.y>H){s.y=30;s.x=-200+Math.random()*1600;}}}
function drawParts(t){ctx.fillStyle=L.m>0.5?`rgba(170,190,255,${0.35*L.b})`:`rgba(255,255,255,${0.35*L.b})`;ctx.beginPath();for(const s of SNOW)ep(s.x,s.y,s.r,s.r);ctx.fill();
 for(const f of FOOD){ctx.fillStyle=lc('#b5773e');ctx.beginPath();ep(f.x,f.y,2.3,2);ctx.fill();}
 for(const p of PARTS){const a=clamp(p.life/p.max,0,1);
  if(p.type==='egg'){ctx.fillStyle=rgba(mixc(lit(p.col),p.col,L.m*0.7),Math.min(1,a*3));ctx.beginPath();ep(p.x,p.y,p.s,p.s);ctx.fill();if(L.m>0.2){ctx.save();ctx.globalCompositeOperation='lighter';glow(p.x,p.y,p.s*4,p.s*4,p.col,L.m*0.5*Math.min(1,a*3));ctx.restore();ctx.globalAlpha=1;}}
  else if(p.type==='heart'){ctx.fillStyle=`rgba(255,110,150,${a})`;ctx.beginPath();heartPath(p.x,p.y,p.s*(1.3-a*0.3));ctx.fill();}
  else if(p.type==='bubble'){ctx.strokeStyle=`rgba(255,255,255,${0.6*a})`;ctx.lineWidth=1;ctx.beginPath();ep(p.x,p.y,p.s,p.s);ctx.stroke();ctx.fillStyle=`rgba(255,255,255,${0.5*a})`;ctx.beginPath();ep(p.x-p.s*0.35,p.y-p.s*0.35,p.s*0.25,p.s*0.25);ctx.fill();}
  else if(p.type==='spark'||p.type==='glint'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(p.col,a);ctx.beginPath();star(p.x,p.y,p.s*(p.type==='glint'?Math.sin(a*Math.PI):1));ctx.fill();ctx.restore();}
  else if(p.type==='ripple'){ctx.strokeStyle=`rgba(255,255,255,${0.6*a})`;ctx.lineWidth=2;ctx.beginPath();ep(p.x,p.y,(1-a)*40+4,((1-a)*40+4)*0.4);ctx.stroke();}}}

/* ============================ 魚の動き ============================ */
function growFish(r,d){const b=r.g??0.8;r.g=Math.min(1,b+d);for(const m of[0.5,1])if(b<m&&r.g>=m){const n=r.name||FISH[r.sp].name;toast(m>=1?`🐟 ${n}が立派なおとなになった！`:`🐟 ${n}がひとまわり大きくなった！`);}}
let FISHES=[];const FSZ=1.45;

function pluck(f,t){const c=SND.ctx;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.045,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);o.connect(g);g.connect(SND.master);g.connect(SND.delay);o.start(t);o.stop(t+1.6);}
function pad(f,t,d){const c=SND.ctx;for(const m of[1,1.5,2]){const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f*m;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.02,t+1.5);g.gain.linearRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+d+0.1);}}

function coralThumb(sp,morph,w=200,h=125,mode='split'){const key=[sp,morph,w,h,mode].join();if(TH.has(key))return TH.get(key);
 const k=2,c=document.createElement('canvas');c.width=w*k;c.height=h*k;const g=c.getContext('2d');const prev=ctx,pm=L.m,pb=L.b;ctx=g;

 ctx=prev;L.m=pm;L.b=pb;const url=c.toDataURL();TH.set(key,url);return url;}

 g.setTransform(k,0,0,k,0,0);thumbBg(g,w,h,0);const f={sp,x:w/2,y:h*0.48,vx:10,vy:0,face:1,ph:0,blink:0,happy:0};g.translate(w/2,h*0.48);g.scale(2.3,2.3);g.translate(-w/2,-h*0.48);drawFish(f,0.3);

document.getElementById('resetBtn').onclick=e=>{if(e.target.dataset.arm){resetGame();}else{e.target.dataset.arm=1;e.target.textContent='本当に消す？（もう一度押す）';}};
addEventListener('beforeunload',()=>{S.flags.lastLight=L.tm;save();});
window.addEventListener('error',e=>{document.body.dataset.err=(e.message||'')+' @'+(e.lineno||'');});

resize();initCaustics();makeAlgaeTex();titleCorals=demoCorals();
const VS=VIEWH&&loadShare(VIEWH);
if(VS){VIEW=true;S=VS;document.body.classList.add('view');document.getElementById('title').classList.add('hidden');document.body.classList.remove('titling');syncFishAndCrew();document.getElementById('mTitle').innerHTML='👀 だれかの水槽を見ています　<b>▶ 自分もはじめる</b>';document.getElementById('mchip').onclick=()=>{location.href=location.href.split('#')[0];};}
else if(DEMO){S=DEF();S.started=true;S.cp=3000;S.eq={tank:3,pump:2,led:2,skimmer:1,cooler:1,ato:1,heater:1,backup:1};S.corals=demoCorals();S.fish=['clown','clown','yellowtang','bluetang','firefish','chromis','chromis','chromis','gramma','blenny','mandarin'].map((sp,i)=>({id:i+1,sp,g:0.9}));S.crew={snail:3,hermit:3};S.algae=Q.has('algae')?80:5;CORAL_IDS.forEach(id=>S.zukan[id]=[0]);S.mi=MISSIONS.length;document.getElementById('title').classList.add('hidden');document.body.classList.remove('titling');syncFishAndCrew();updMission();}
else if(S.started||S.flags.intro||S.corals.length){document.getElementById('startBtn').textContent='つづきから';document.getElementById('resetBtn').classList.remove('hidden');S.started=false;syncFish([{sp:'clown'},{sp:'clown'},{sp:'yellowtang'},{sp:'bluetang'}]);}
else syncFish([{sp:'clown'},{sp:'clown'},{sp:'yellowtang'},{sp:'bluetang'}]);
if(Q.get('light')==='blue'){L.m=L.tm=1;}if(Q.get('light')==='mix'){L.m=L.tm=0.5;}
if(Q.has('shot'))document.body.classList.add('shot');
if(Q.has('card')&&DEMO)setTimeout(()=>openCard(1002),300);
if(Q.has('shop')&&DEMO)setTimeout(()=>openShop('coral'),300);
if(Q.has('zukan')&&DEMO)setTimeout(()=>openZukan('torch',1),300);
syncLightUI();if(!VIEW)updMission();requestAnimationFrame(frame);
</script>
</body>
</html>
